# League registry — defines every league the platform ingests.
# Adding a league = filling out an entry here + writing a source audit CSV
# under docs/source_audit/<league_id>.csv before any spider is written.
#
# season_format:
#   aug_may  – northern-hemisphere club calendar (Aug start, May end)
#   jan_dec  – calendar year
#   irregular – cup / continental, variable
#   tbd      – not yet audited
#
# seasons use plain hyphens ("2024-25"); spiders translate to en-dash when
# building Wikipedia URLs.
#
# expected_teams: used by quality tests to compute expected match count.
# null = use n*(n-1) formula (standard double round-robin).

leagues:

  # ──────────────────────────────────────────────────────────
  # WAVE 1
  # ──────────────────────────────────────────────────────────

  - league_id: RSA_PREM
    name: South African Premiership
    country: South Africa
    wave: 1
    language: en
    season_format: aug_may
    seasons:
      - "2021-22"
      - "2022-23"
      - "2023-24"
      - "2024-25"
      - "2025-26"
      - "2026-27"
    wikipedia_title_template: "{season} South African Premiership"
    sources:
      - wikipedia_season
      - rsssf_tables
      - psl_official
    expected_teams: 16

